name: Android
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "client/**"
      - "protocol.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/build-android-jni.sh"
      - ".cargo/config.toml"
      - ".github/workflows/android.yml"
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup show
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install NDK
        run: |
          sdkmanager --install "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Assemble Debug APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Package APK and checksum
        run: |
          mkdir -p dist/android
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/android/wss-tunnel-android-arm64-debug.apk
          cd dist/android
          sha256sum wss-tunnel-android-arm64-debug.apk > wss-tunnel-android-arm64-debug.apk.sha256
          sha256sum --check wss-tunnel-android-arm64-debug.apk.sha256
      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wss-tunnel-android-debug
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload unit test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unit-test-reports
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
