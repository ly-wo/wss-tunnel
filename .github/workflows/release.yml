name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate tag matches workspace version
        run: python3 scripts/check_release.py
  verify:
    needs: version
    uses: ./.github/workflows/verify.yml
  binaries:
    needs: verify
    uses: ./.github/workflows/binaries.yml
  android:
    needs: verify
    uses: ./.github/workflows/android.yml
    secrets: inherit
    with:
      require_stable_signing: true
  container:
    needs: [verify, binaries]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
  release:
    needs: [binaries, container, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - name: Download Android APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wss-tunnel-android-debug
          path: dist
      - name: Verify Android checksum
        working-directory: dist
        run: sha256sum --check wss-tunnel-android-arm64-debug.apk.sha256
      - name: Verify checksums and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/check_assets.py
          cat dist/wss-tunnel-android-arm64-debug.apk.sha256 >> dist/SHA256SUMS
          if gh release view "$TAG" --json isDraft > release-state.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Refusing to overwrite a published release"'
          else
            gh release create "$TAG" --verify-tag --draft --generate-notes --title "$TAG"
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false --latest
