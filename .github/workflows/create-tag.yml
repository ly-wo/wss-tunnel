name: Create version tag
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing workspace version, e.g. 0.1.0 (without v)'
        required: true
        type: string
permissions:
  contents: write
  actions: write
concurrency:
  group: create-version-tag
  cancel-in-progress: false
jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate version and create tag
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export TAG="v$VERSION"
          python3 scripts/check_release.py --tag "$TAG"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; use Release on that tag to retry." >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          # Tags pushed with GITHUB_TOKEN do not trigger push workflows.
          gh workflow run release.yml --ref "$TAG"
