name: Verify
on:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test release scripts
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Install Rust
        run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - name: Check Compose and scripts
        run: |
          docker compose --env-file server/.env.example -f server/compose.yaml config --quiet
          bash -n server/init.sh client/run.sh
      - name: Build container
        run: docker build -f server/Dockerfile -t wss-tunnel:test .
      - name: Test WSS through Traefik and Docker bridge
        env:
          TUNNEL_TEST_IMAGE: wss-tunnel:test
        run: python3 -u tests/e2e.py
